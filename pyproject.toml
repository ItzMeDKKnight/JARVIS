[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "A local, privacy-first J.A.R.V.I.S.-style voice assistant (English + Hindi)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Every runtime dependency is pinned and was checked for network behaviour.
# See PRIVACY.md before adding anything here.
dependencies = [
    "anthropic==1.15.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    # Voice (Phase 2). All local; see PRIVACY.md for each one's network behaviour.
    "faster-whisper==1.2.1",
    "onnxruntime==1.31.0",
    "kokoro-onnx==0.6.1",       # pulls in phonemizer + espeak-ng (GPL-3.0)
    "sounddevice==0.5.6",
    "numpy>=2.0.2",
    # HUD link (Phase 5): local WebSocket server on 127.0.0.1. No network calls of its own.
    "websockets==17.2",
    # create_pdf: fpdf2 (LGPL-3.0, pip-installed, never vendored) lays out the PDF;
    # uharfbuzz (Apache-2.0) shapes Devanagari. Offline: Jarvis only ever places text,
    # never fpdf2's remote-image loading. Pulls in fontTools (MIT) and Pillow (MIT-CMU).
    "fpdf2==2.9.0",
    "uharfbuzz==0.57.0",
]

[project.optional-dependencies]
# Fallback TTS engine. GPL-3.0-or-later, so it is opt-in.
piper = [
    "piper-tts==1.8.0",
]
dev = [
    "psutil==7.2.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
jarvis = "jarvis.main:run"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "ANN", "D"]
# Module docstrings are required (D100); per-function docstrings are written
# where they explain *why*, not mechanically for every method.
ignore = [
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "D401",
    "RUF001",  # Devanagari text in aliases and narration is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "D", "ANN"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
packages = ["jarvis"]

# Audio/ML libraries without type information.
[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "faster_whisper.*", "onnxruntime", "kokoro_onnx", "piper", "psutil", "fpdf", "fpdf.*"]
ignore_missing_imports = true
