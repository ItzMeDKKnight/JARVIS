# App allowlist. Jarvis only launches what is listed here, or, after you
# confirm, a Start Menu shortcut whose name matches what you asked for.
# It never runs shell commands.
#
# launch.kind:
#   shell  - handed to Windows ShellExecute: an exe registered under "App Paths"
#            (chrome.exe, msedge.exe) or a URI like ms-settings:
#   path   - an absolute path to an executable; %ENV_VARS% are expanded
#   appx   - a Store/UWP app user model ID (find one with PowerShell: Get-StartApps)
#
# Aliases are matched case-insensitively after Unicode normalisation; Hindi
# nukta differences (फ़ / फ) are ignored, so either spelling works.

apps:
  - id: chrome
    display_name: Google Chrome
    aliases: [chrome, google chrome, chrome browser, crome, क्रोम, गूगल क्रोम, क्रोम ब्राउज़र]
    launch: {kind: shell, target: chrome.exe}

