  - id: vscode
    display_name: VS Code
    aliases: [vs code, vscode, visual studio code, code editor, v s code, वीएस कोड, वी एस कोड, विजुअल स्टूडियो कोड, कोड एडिटर]
    launch: {kind: shell, target: code.exe}

  - id: notepad
    display_name: Notepad
    aliases: [notepad, note pad, नोटपैड, नोट पैड]
    launch: {kind: appx, target: "Microsoft.WindowsNotepad_8wekyb3d8bbwe!App"}

  - id: calculator
    display_name: Calculator
    aliases: [calculator, calc, calculater, कैलकुलेटर, कैल्क्युलेटर, कैलक्यूलेटर, कैलकुलेटर ऐप, गणक]
    launch: {kind: appx, target: "Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"}

  - id: file_explorer
    display_name: File Explorer
    aliases: [file explorer, explorer, files, my files, file manager, this pc, my computer, फ़ाइल एक्सप्लोरर, फ़ाइलें, फ़ाइल मैनेजर, एक्सप्लोरर, मेरी फ़ाइलें]
    launch: {kind: shell, target: explorer.exe}

  - id: settings
    display_name: Settings
    aliases: [settings, windows settings, setting, सेटिंग्स, सेटिंग, सेटिंग्ज़, विंडोज़ सेटिंग्स]
    launch: {kind: shell, target: "ms-settings:"}

  - id: terminal
    display_name: Terminal
    aliases: [terminal, windows terminal, command prompt, cmd, powershell, टर्मिनल, कमांड प्रॉम्प्ट]
    launch: {kind: shell, target: wt.exe}

  - id: paint
    display_name: Paint
    aliases: [paint, ms paint, mspaint, पेंट, एमएस पेंट]
