# Websites Jarvis opens by name ("open GitHub", "जीमेल खोलो") in your default browser.
# Only http/https addresses are accepted. Anything not listed here can still be opened
# by saying its address ("open example.com"). A name listed here wins over a Start Menu
# shortcut, so leave out sites you'd rather open as an installed app (e.g. Spotify).
websites:
  - id: youtube
    display_name: YouTube
